name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SEQUENCE_VAULT_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.8.17
      - name: PostgreSQL 17 client tools (the restore drill's pg_dump must match the server)
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
      - run: make setup
      - run: make check
      - run: make integration
      - run: make performance

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: [check, web]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SEQUENCE_VAULT_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.8.17
      - run: make setup
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web
      - run: pnpm e2e
        working-directory: apps/web

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate the Compose stack
        run: |
          sed 's/=$/=ci-placeholder/' infrastructure/local/compose.env.example > "$RUNNER_TEMP/compose.env"
          docker compose -f infrastructure/local/compose.yaml --env-file "$RUNNER_TEMP/compose.env" config --quiet
      - run: docker build -f services/backend/Dockerfile -t sequence-vault/backend:ci .
      - run: docker build -t sequence-vault/web:ci apps/web
      - name: Smoke-test the backend image
        run: >-
          docker run --rm -i --read-only --tmpfs /tmp --cap-drop ALL
          --security-opt no-new-privileges:true sequence-vault/backend:ci
          python - < infrastructure/deployment/smoke_image.py
      - name: Smoke-test the web image
        run: |
          docker run -d --name web -p 8080:8080 --read-only --tmpfs /tmp \
            --tmpfs /etc/nginx/conf.d:uid=101,gid=101 --tmpfs /var/cache/nginx:uid=101,gid=101 \
            -e SEQUENCE_VAULT_PROXY_SECRET=ci -e SEQUENCE_VAULT_API_UPSTREAM=127.0.0.1:9 \
            sequence-vault/web:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/ -o /dev/null && break; sleep 1; done
          docker logs web
          curl -fsS http://127.0.0.1:8080/records | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X PUT --data-binary @<(head -c 20000001 /dev/zero) http://127.0.0.1:8080/v1/uploads/x/content)" = 413
