# Local, production-shaped stack: OIDC proxy -> web (nginx) -> API; worker; PostgreSQL,
# MinIO (S3) and ClamAV. Every port binds to loopback. Credentials come from an ignored
# env file: cp infrastructure/local/compose.env.example infrastructure/local/compose.env
#
#   docker compose -f infrastructure/local/compose.yaml --env-file infrastructure/local/compose.env up --build
#
# PostgreSQL and MinIO live on internal networks only; use `docker compose exec` to reach them.
# Image tags are pinned; pin digests (image@sha256:...) when promoting to a shared environment.
name: sequence-vault

x-backend: &backend
  build:
    context: ../..
    dockerfile: services/backend/Dockerfile
  image: sequence-vault/backend:local
  environment: &backend-env
    SEQUENCE_VAULT_ENV: production
    SEQUENCE_VAULT_DATABASE_URL: postgresql+psycopg://vault:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/vault
    SEQUENCE_VAULT_STORAGE: s3
    SEQUENCE_VAULT_OBJECT_STORAGE_ENDPOINT: http://minio:9000
    SEQUENCE_VAULT_OBJECT_STORAGE_BUCKET: sequence-vault-sources
    SEQUENCE_VAULT_OBJECT_STORAGE_REGION: us-east-1
    SEQUENCE_VAULT_OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
    SEQUENCE_VAULT_OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    SEQUENCE_VAULT_SCANNER: clamd
    SEQUENCE_VAULT_CLAMD_ADDRESS: clamav:3310
    SEQUENCE_VAULT_IDENTITY_HEADER: X-Forwarded-Email
    SEQUENCE_VAULT_PROXY_SECRET: ${SEQUENCE_VAULT_PROXY_SECRET:?set SEQUENCE_VAULT_PROXY_SECRET}
    SEQUENCE_VAULT_AI_ENABLED: "false"
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  restart: unless-stopped

services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: vault
      POSTGRES_USER: vault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault -d vault"]
      interval: 5s
      retries: 20
    networks: [data]
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      retries: 20
    networks: [data]
    restart: unless-stopped

  minio-bucket:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio: {condition: service_healthy}
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000
    # Private bucket with versioning, so an overwritten or deleted object can be recovered.
    entrypoint: ["/bin/sh", "-c", "mc mb --ignore-existing local/sequence-vault-sources && mc version enable local/sequence-vault-sources && mc anonymous set none local/sequence-vault-sources"]
    networks: [data]

  clamav:
    image: clamav/clamav:1.4.3
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      start_period: 300s
      retries: 10
    volumes: [clamav-db:/var/lib/clamav]
    # Needs egress for signature updates (freshclam).
    networks: [data, egress]
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["python", "-m", "sequence_vault.entrypoints.admin", "migrate"]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [data]
    restart: "no"

  api:
    <<: *backend
    depends_on:
      migrate: {condition: service_completed_successfully}
      minio-bucket: {condition: service_completed_successfully}
      clamav: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=3)"]
      interval: 10s
      retries: 10
    # Reachable only from the web container on the internal app network.
    networks: [app, data]

  worker:
    <<: *backend
    command: ["python", "-m", "sequence_vault.entrypoints.worker_main"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      minio-bucket: {condition: service_completed_successfully}
      clamav: {condition: service_healthy}
    # Parsers run in this container: no route to the internet (ADR 0003). Enabling the model
    # gateway needs an approved egress path to the provider only.
    networks: [data]

  web:
    build: {context: ../../apps/web}
    image: sequence-vault/web:local
    environment:
      SEQUENCE_VAULT_API_UPSTREAM: api:8000
      SEQUENCE_VAULT_PROXY_SECRET: ${SEQUENCE_VAULT_PROXY_SECRET:?set SEQUENCE_VAULT_PROXY_SECRET}
    depends_on:
      api: {condition: service_healthy}
    read_only: true
    # nginx renders its template into conf.d at start-up and writes its cache (uid 101).
    tmpfs:
      - /tmp
      - /etc/nginx/conf.d:uid=101,gid=101
      - /var/cache/nginx:uid=101,gid=101
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [app]
    restart: unless-stopped

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
    depends_on:
      web: {condition: service_started}
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:?set OIDC_ISSUER_URL}
      OAUTH2_PROXY_CLIENT_ID: ${OIDC_CLIENT_ID:?set OIDC_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:?set OAUTH2_PROXY_COOKIE_SECRET}
      OAUTH2_PROXY_REDIRECT_URL: http://localhost:4180/oauth2/callback
      OAUTH2_PROXY_EMAIL_DOMAINS: ${OIDC_EMAIL_DOMAINS:-*}
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_UPSTREAMS: http://web:8080/
      # Sets X-Forwarded-Email (replacing any client-sent value) for the API's identity header.
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_COOKIE_SECURE: ${OAUTH2_PROXY_COOKIE_SECURE:-false}
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
    ports: ["127.0.0.1:4180:4180"]
    networks: [app, egress]
    restart: unless-stopped

networks:
  data: {internal: true}
  app: {internal: true}
  egress: {}

volumes:
  postgres-data: {}
  minio-data: {}
  clamav-db: {}
